name: CI
on: push
jobs:
  linting:
    runs-on: ubuntu-latest
    name: Linting of Ruby files
    steps:
      - uses: actions/checkout@v7
      - name: Install Ruby, Bundler and gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - run: bundle exec standardrb

  tests:
    runs-on: ubuntu-latest
    name: Test ${{ matrix.gemfile }} with Ruby ${{ matrix.ruby-version }}
    strategy:
      fail-fast: false
      matrix:
        ruby-version:
          - "3.2"
          - "3.3"
          - "3.4"
          - "4.0"
        gemfile:
          - rails7.2
          - rails8.0
          - rails8.1
    env:
      BUNDLE_GEMFILE: gemfiles/${{ matrix.gemfile }}.gemfile
    steps:
      - uses: actions/checkout@v7
      - name: Install Ruby, Bundler and gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - parallel:
          - name: Test with mysql2
            run: bundle exec rake test
            env: {TEST_ADAPTER_MYSQL: mysql2}
          - name: Test with trilogy
            run: bundle exec rake test
            env: {TEST_ADAPTER_MYSQL: trilogy}

  tests_successful:
    name: Tests passing?
    needs: tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          if ${{ needs.tests.result == 'success' }}
          then
            echo "All tests passed"
          else
            echo "Some tests failed"
            false
          fi
